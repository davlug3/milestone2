<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Impact in Numbers | Milestone2</title><style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#f5eee3;font:14px system-ui;overflow:hidden}canvas{display:block}#loading{position:fixed;inset:0;z-index:200;background:#101512;display:grid;place-items:center;text-align:center;padding:24px}#loading[hidden]{display:none}dialog{width:min(620px,calc(100% - 28px));background:#202923;color:#f5eee3;border:1px solid #617563;border-radius:14px;padding:22px}dialog::backdrop{background:#000b}textarea{width:100%;height:260px;background:#111713;color:#f5eee3;border:1px solid #617563;padding:12px;font:13px monospace;border-radius:8px}button{cursor:pointer;padding:9px 12px;border:0;border-radius:6px}#edit{position:fixed;z-index:110;top:50px;right:12px;background:#e5d2a7;color:#17251c}#edit[hidden],#save-frame[hidden]{display:none}#save-frame{position:fixed;z-index:110;top:88px;right:12px;background:#e5d2a7;color:#17251c}#message{color:#ffb4a6;min-height:1em}#actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style></head><body><div id="loading" role="status">Preparing data presentation…</div><canvas id="scene" aria-label="Animated statistics presentation"></canvas><button id="edit" type="button">Edit data</button><button id="save-frame" type="button" title="Save the current layer as a full-resolution PNG">Save PNG</button><dialog id="editor"><h2>Edit presentation data</h2><p>Each slide needs a title and number. Subtitle is optional. Changes are saved on this device.</p><textarea id="json" aria-label="Slide data JSON" spellcheck="false"></textarea><p id="message" role="alert"></p><div id="actions"><button id="save">Apply</button><button id="reset">Restore examples</button><button id="cancel">Cancel</button></div></dialog><script>window.addEventListener('error',e=>{const l=document.getElementById('loading');if(!l.hidden)l.textContent=e.message||'Unable to load presentation';});</script><script type="module" src="/src/main.js"></script></body></html>
