<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Inline favicon: avoids a 404 request in headless validation. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231c2733'/%3E%3C/svg%3E"
    />
    <title>Cinematic Book Animation</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .demo-ui {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(18, 20, 24, 0.72);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-family: system-ui, -apple-system, sans-serif;
        color: #e8e4da;
        user-select: none;
      }
      .demo-play {
        appearance: none;
        border: none;
        cursor: pointer;
        padding: 9px 20px;
        min-width: 96px;
        border-radius: 999px;
        background: #e8e4da;
        color: #14161a;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.02em;
        transition: transform 0.08s ease, background 0.15s ease;
      }
      .demo-play:hover {
        background: #ffffff;
      }
      .demo-play:active {
        transform: scale(0.97);
      }
      .demo-time {
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        min-width: 42px;
        text-align: right;
        opacity: 0.85;
      }
    </style>
  </head>
  <body><style>
#startup-loader{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#151310;color:#f5eee3;font:15px system-ui;padding:24px;box-sizing:border-box}
#startup-loader[hidden]{display:none}#startup-loader .load-panel{width:min(360px,100%);text-align:center}#startup-loader h1{font-size:clamp(22px,5vw,30px);margin:14px 0 8px;letter-spacing:-.03em}#startup-loader .load-kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfb798}#startup-loader p{line-height:1.5;color:#c8beaf;margin:8px 0;overflow-wrap:anywhere}#startup-loader progress{display:block;width:100%;height:9px;margin:22px auto 10px;accent-color:#d9bb91}#startup-loader .load-count{font-size:12px;font-variant-numeric:tabular-nums;min-height:18px}#startup-loader .load-actions{display:flex;justify-content:center;gap:12px;margin-top:18px}#startup-loader .load-actions[hidden]{display:none}#startup-loader button,#startup-loader a{font:inherit;color:#251a12;background:#f2e8d8;border:0;border-radius:8px;padding:12px;text-decoration:none;cursor:pointer}#startup-loader .load-spinner{width:34px;height:34px;border:3px solid #ffffff20;border-top-color:#d9bb91;border-radius:50%;margin:0 auto 22px;animation:load-spin .85s linear infinite}@keyframes load-spin{to{transform:rotate(360deg)}}#startup-loader[data-error] .load-spinner,#startup-loader[data-error] progress{display:none}@media(prefers-reduced-motion:reduce){#startup-loader .load-spinner{animation:none}}
</style><div id="startup-loader" role="status" aria-live="polite" aria-busy="true"><div class="load-panel"><div class="load-spinner" aria-hidden="true"></div><div class="load-kicker">Milestone2</div><h1>Preparing your presentation</h1><p id="load-stage">Downloading application…</p><progress id="load-progress" aria-label="Loading progress"></progress><p id="load-count" class="load-count"></p><div class="load-actions" hidden><button type="button" onclick="location.reload()">Retry</button><a href="/">Main menu</a></div><noscript><p>JavaScript is required for the 3D preview.</p></noscript></div></div><script>
(()=>{const el=document.getElementById('startup-loader'),stage=document.getElementById('load-stage'),bar=document.getElementById('load-progress'),count=document.getElementById('load-count'),actions=el.querySelector('.load-actions');const q=new URLSearchParams(location.search);let active=true,slow;const exportMode=q.has('export')||q.has('geometry-export')||q.has('test');if(exportMode)el.hidden=true;
function watchdog(){clearTimeout(slow);slow=setTimeout(()=>{if(active){count.textContent='Still loading. This may take longer on a slow connection or device.';actions.hidden=false;}},20000)}
window.__startupLoader={stage(message,done,total){if(!active)return;stage.textContent=message;if(Number.isFinite(done)&&Number.isFinite(total)&&total>0){bar.max=total;bar.value=Math.max(0,Math.min(done,total));count.textContent=done+' / '+total;}else{bar.removeAttribute('value');count.textContent='';}actions.hidden=true;watchdog();},ready(){if(!active)return;active=false;clearTimeout(slow);el.hidden=true;el.setAttribute('aria-busy','false');},fail(message){if(!active)return;active=false;clearTimeout(slow);el.dataset.error='';el.setAttribute('aria-busy','false');stage.textContent='Unable to load presentation';count.textContent=String(message||'Please retry.');actions.hidden=false;}};
addEventListener('error',e=>{if(!active)return;if(e.target instanceof HTMLScriptElement||e.target instanceof HTMLLinkElement&&e.target.rel==='modulepreload')window.__startupLoader.fail('Application download failed. Check your connection and retry.');else if(e instanceof ErrorEvent)window.__startupLoader.fail(e.message);},true);addEventListener('unhandledrejection',e=>window.__startupLoader.fail(e.reason?.message||e.reason));watchdog();
})();
</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
