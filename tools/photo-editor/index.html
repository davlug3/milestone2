<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Milestone2 | Scene photo editor</title><style>
*{box-sizing:border-box}body{margin:0;background:#14181c;color:#e6e9ee;font:14px system-ui,sans-serif}header{position:sticky;top:0;background:#1c2228;z-index:3;border-bottom:1px solid #39424c;padding:15px 22px}h1{font-size:20px;margin:0 0 12px}button,input,select{font:inherit;color:inherit;background:#292f36;border:1px solid #49525c;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{background:#3d4650}button:disabled{opacity:.4;cursor:default}button.active,#save{background:#e8c788;color:#171717;border-color:#e8c788;font-weight:650}nav,.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar{margin:14px 0}.spacer{flex:1}#status{font-size:13px;color:#e8c788}main{display:grid;grid-template-columns:minmax(300px,1.5fr) minmax(290px,1fr);gap:20px;padding:20px}section{min-width:0}h2{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.tile{background:#20262c;border:1px solid #343c45;border-radius:8px;overflow:hidden;min-width:0}.tile img{width:100%;height:110px;object-fit:contain;background:#101215;display:block;cursor:zoom-in}.tile div{padding:7px;display:flex;align-items:center;gap:5px}.tile span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;font-size:12px}.tile button{padding:5px 8px}.selected{border-color:#e8c788}.row{display:flex;gap:7px;align-items:center;background:#20262c;padding:8px;margin:7px 0;border-radius:7px}.row img{width:70px;height:50px;object-fit:contain;cursor:zoom-in}.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.row input:first-child{flex:1;width:0}.row input[type=number]{width:100px}aside{position:sticky;top:135px;max-height:calc(100vh - 150px);overflow:auto}dialog{background:#181d23;border:1px solid #666;color:white;max-width:95vw;max-height:95vh;padding:10px}dialog img{display:block;max-width:88vw;max-height:78vh;object-fit:contain}dialog::backdrop{background:#000b}a{color:#e8c788}small{color:#aab3be}@media(max-width:700px){main{grid-template-columns:1fr}aside{position:static;max-height:none}header{position:static}}
</style></head><body><header><h1>Milestone2 · Scene photo editor</h1><nav id="tabs"></nav><div class="bar"><button id="save" disabled>Save changes</button><button id="reload">Reload</button><a href="/">Preview presentations ↗</a><span class="spacer"></span><span id="status">Loading…</span></div></header><main><section id="library"><h2>Photo library <small id="total"></small></h2><div class="bar"><input id="search" placeholder="Search filename or folder"><select id="group"><option value="">All folders</option></select><label><input type="checkbox" id="only"> Selected only</label></div><div class="grid" id="photos"></div></section><aside><h2 id="heading">Selected photos</h2><div id="selection"></div></aside></main><dialog id="viewer"><button id="close">Close</button><p id="filename"></p><img id="large" alt="Photo preview"></dialog><script>
const $=id=>document.getElementById(id),scenes=['book','slideshow','clothesline','floating'],labels={book:'Book',slideshow:'Slideshow',clothesline:'Clothesline',floating:'Floating',stats:'Statistics'};let scene='book',state,choices={},stats=[],dirty=false,token='';const cloud=!!document.querySelector('meta[name=editor-cloud]');const api=cloud?'/api/editor':'/editor/api';
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n},url=p=>cloud?(state.photos.find(x=>x.path===p)?.url||''):'/editor/photo?path='+encodeURIComponent(p),name=p=>p.split('/').pop();function btn(t,fn,disabled=false){const b=el('button',t);b.onclick=fn;b.disabled=disabled;return b}function img(p){let n=el('img');n.loading='lazy';n.alt=name(p);n.src=url(p);n.onclick=()=>{$('large').src=url(p);$('filename').textContent=p;$('viewer').showModal()};return n}function change(){dirty=true;$('save').disabled=false;$('status').textContent='Unsaved changes'}function render(){if(!state)return;$('tabs').replaceChildren(...[...scenes,'stats'].map(s=>{let b=btn(labels[s]+(s==='stats'?'':' ('+choices[s].length+')'),()=>{scene=s;render()});if(s===scene)b.className='active';return b}));$('library').hidden=scene==='stats';$('heading').textContent=scene==='stats'?'Statistics':'Selected photos · '+choices[scene].length;$('selection').replaceChildren();if(scene==='stats'){stats.forEach((x,i)=>{let row=el('div',undefined,'row'),a=el('input'),b=el('input');a.value=x.title;b.type='number';b.min='0';b.value=x.number;a.oninput=()=>{x.title=a.value;change()};b.oninput=()=>{x.number=Number(b.value);change()};row.append(a,b,btn('Remove',()=>{stats.splice(i,1);change();render()}));$('selection').append(row)});$('selection').append(btn('+ Add statistic',()=>{stats.push({title:'New statistic',number:0});change();render()}));return}
const selected=choices[scene],q=$('search').value.toLowerCase(),g=$('group').value,filtered=state.photos.filter(x=>(!g||x.group===g)&&x.path.toLowerCase().includes(q)&&(!$('only').checked||selected.includes(x.path)));$('total').textContent=filtered.length+' / '+state.photos.length;$('photos').replaceChildren(...filtered.map(x=>{let yes=selected.includes(x.path),t=el('div',undefined,'tile'+(yes?' selected':'')),r=el('div'),label=el('span',name(x.path));label.title=x.path;r.append(label,btn(yes?'−':'+',()=>{if(yes)selected.splice(selected.indexOf(x.path),1);else selected.push(x.path);change();render()}));t.append(img(x.path),r);return t}));
if(!selected.length)$('selection').append(el('p','Empty collection: preview uses real-photo fallback.'));selected.forEach((p,i)=>{const row=el('div',undefined,'row'),label=el('span',(i+1)+'. '+name(p));label.title=p;const move=d=>{[selected[i],selected[i+d]]=[selected[i+d],selected[i]];change();render()};row.append(img(p),label,btn('↑',()=>move(-1),i===0),btn('↓',()=>move(1),i===selected.length-1),btn('×',()=>{selected.splice(i,1);change();render()}));$('selection').append(row)})}
async function load(){try{$('status').textContent='Loading…';if(cloud&&!token){token=prompt('Editor token:')||'';if(!token)throw Error('Editor token required. Click Reload to try again.')}const r=await fetch(cloud?api:api+'/state',{headers:cloud?{'X-Editor-Token':token}:{}});if(r.status===401)token='';if(!r.ok)throw Error(await r.text());state=await r.json();choices=Object.fromEntries(scenes.map(s=>[s,[...state.config[s].photos]]));stats=structuredClone(state.config.stats.slides);$('group').replaceChildren(new Option('All folders',''),...[...new Set(state.photos.map(x=>x.group))].sort().map(g=>new Option(g,g)));dirty=false;$('save').disabled=true;$('save').textContent=cloud?'Download configuration draft':'Save changes';$('status').textContent='Ready · '+state.photos.length+' photos'+(cloud?' · cloud draft mode':'');render()}catch(e){$('status').textContent=e.message}}
$('reload').onclick=()=>{if(!dirty||confirm('Discard unsaved changes?'))load()};$('search').oninput=render;$('group').onchange=render;$('only').onchange=render;$('close').onclick=()=>$('viewer').close();$('save').onclick=async()=>{if(!confirm(cloud?'Download a configuration draft for review on the authoritative local machine?':'Save local photo selections and regenerate scene manifests?'))return;$('save').disabled=true;$('status').textContent='Saving…';try{const r=await fetch(cloud?api:api+'/save',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Request':'1',...(cloud?{'X-Editor-Token':token}:{})},body:JSON.stringify({revision:state.revision,scenes:choices,stats})});const d=await r.json();if(!r.ok)throw Error(d.error);if(cloud){const u=URL.createObjectURL(new Blob([d.draft],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='photos.config.draft.jsonc';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);dirty=false;$('status').textContent='Draft downloaded · apply explicitly on local workstation';}else{state.revision=d.revision;dirty=false;$('status').textContent=d.message+' · reload preview'}}catch(e){$('status').textContent=e.message;$('save').disabled=false}};addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load();
</script></body></html>
